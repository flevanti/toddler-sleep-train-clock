<title>Sleep Clock</title>
<style>
  /* Written for Safari 12 (iPad mini 2): no flex gap, no inset, no aspect-ratio. */
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0); touch-action: manipulation;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
  .clk { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .clk .face { width: 72vmin; height: 72vmin; }
  .face svg { width: 100%; height: 100%; display: block; }
  .clk .time { font-size: 11vmin; font-weight: 200; letter-spacing: 0.02em; margin-top: 2vmin; font-variant-numeric: tabular-nums; }
  .clk .label { font-size: 4vmin; font-weight: 300; margin-top: 1vmin; opacity: .8; }
  .snap { pointer-events: none; }
  .clk .below { width: 60vmin; }
  .mini .below { width: 150px; }
  .below svg { width: 100%; height: auto; display: block; }
  .layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; }
  .layer svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .clk.below-on .face { width: 58vmin; height: 58vmin; }
  .mini.below-on .face { width: 76px; height: 76px; }
  body.sim .clk.below-on .face { width: 42vmin; height: 42vmin; }
  .slow .twinkle { -webkit-animation-duration: 7s; animation-duration: 7s; }
  .slow .zz { -webkit-animation-duration: 8s; animation-duration: 8s; }
  .twinkle { -webkit-animation: tw 4s ease-in-out infinite; animation: tw 4s ease-in-out infinite; }
  @-webkit-keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .zz { -webkit-animation: zz 5s ease-in-out infinite; animation: zz 5s ease-in-out infinite; }
  @-webkit-keyframes zz { 0% { opacity: 0; -webkit-transform: translateY(8px) } 40%,70% { opacity: 1 } 100% { opacity: 0; -webkit-transform: translateY(-10px) } }
  @keyframes zz { 0% { opacity: 0; transform: translateY(8px) } 40%,70% { opacity: 1 } 100% { opacity: 0; transform: translateY(-10px) } }

  /* hidden settings hotspot: top-right corner, long press */
  #hot { position: fixed; top: 0; right: 0; width: 110px; height: 110px; z-index: 5; }
  #hotring { position: fixed; top: 20px; right: 20px; width: 60px; height: 60px; z-index: 6; opacity: 0; pointer-events: none; }

  /* sound-locked badge */
  #badge { position: fixed; z-index: 7; display: none; background: rgba(255,255,255,.12); color: #fff;
    border-radius: 999px; padding: 10px 18px; font-size: 16px; left: 50%; bottom: 18px;
    -webkit-transform: translateX(-50%); transform: translateX(-50%); white-space: nowrap; }
  #badge.big { top: 50%; bottom: auto; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%);
    background: rgba(20,20,20,.92); border: 2px solid #fff; font-size: 26px; padding: 24px 36px; border-radius: 22px; text-align: center; }
  #badge.big small { display: block; font-size: 15px; opacity: .7; margin-top: 8px; }
  #badge.night { background: rgba(255,255,255,.06); color: rgba(255,255,255,.35); font-size: 13px; padding: 6px 12px; }

  /* overlays */
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; background: #111; display: none;
    overflow-y: auto; -webkit-overflow-scrolling: touch; -webkit-user-select: text; user-select: text; }
  .overlay.show { display: block; }
  #pinpad { background: rgba(0,0,0,.94); text-align: center; z-index: 30; }
  #pinpad .inner { margin: 8vh auto 0; width: 300px; }
  #pinpad h2 { font-weight: 300; margin: 0 0 10px; }
  #pindots { font-size: 34px; letter-spacing: 12px; height: 48px; }
  #pinpad .keys { margin-top: 10px; }
  #pinpad button.k { width: 80px; height: 80px; margin: 8px; border-radius: 50%; border: 1px solid #555; background: #222;
    color: #fff; font-size: 30px; font-weight: 300; }
  #pinmsg { color: #ff6b6b; height: 22px; margin-top: 6px; }

  #settings { background: #15171c; color: #e8e8ea; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 18px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar h1 { font-size: 26px; font-weight: 600; margin: 0; }
  .sec { background: #1f2229; border-radius: 14px; padding: 14px 16px; margin-top: 16px; }
  .sec h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8a8f9c; margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid #2a2e37; }
  .row:first-of-type { border-top: 0; }
  .row label.l { -webkit-flex: 1; flex: 1; font-size: 16px; }
  .hint { font-size: 13px; color: #8a8f9c; margin: 6px 0 0; line-height: 1.45; }
  input[type=time], select, input[type=text], textarea, input[type=tel] { font-size: 16px; background: #2a2e37; color: #fff;
    border: 1px solid #3a3f4b; border-radius: 8px; padding: 6px 8px; font-family: inherit; }
  input[type=range] { width: 220px; }
  textarea { width: 100%; box-sizing: border-box; height: 80px; font-family: Menlo, monospace; font-size: 12px; }
  button.b { font-size: 16px; background: #2f6fed; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; margin: 4px 6px 4px 0; font-family: inherit; }
  button.b.g { background: #2a2e37; }
  button.b.r { background: #b3261e; }
  button.b.ok { background: #1f9d55; }
  table.sched { width: 100%; border-collapse: collapse; }
  table.sched th { font-size: 12px; color: #8a8f9c; font-weight: 600; text-align: left; padding: 4px 4px; }
  table.sched td { padding: 6px 4px; border-top: 1px solid #2a2e37; font-size: 16px; }
  table.sched td.d { font-weight: 600; width: 50px; }
  table.sched tr.today td.d { color: #4cd964; }
  .val { color: #8a8f9c; min-width: 48px; text-align: right; display: inline-block; }
  .sw { position: relative; width: 52px; height: 30px; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #3a3f4b; border-radius: 30px; transition: .2s; }
  .sw span:before { content: ""; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .sw input:checked + span { background: #34c759; }
  .sw input:checked + span:before { -webkit-transform: translateX(22px); transform: translateX(22px); }
  .swc { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #15171c; box-shadow: 0 0 0 2px #3a3f4b; margin: 3px 0 3px 10px; padding: 0; vertical-align: middle; }
  .swc.on { box-shadow: 0 0 0 3px #fff; }
  .sec h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; color: #6b7080; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 0; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8a8f9c; margin: 16px 0 2px; font-weight: 600; }
  .row.sub { padding-left: 18px; }
  .row.sub label.l { color: #b9bdc7; }
  .status { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: #2a2e37; margin-top: 8px; }
  .status.bad { background: #4a1f1f; }
  .status.good { background: #1e3b28; }
  ol.setup { margin: 4px 0 0; padding-left: 22px; line-height: 1.55; font-size: 15px; }
  /* settings: fixed header with live mini preview, scrolling body below */
  #settings { overflow: hidden; }
  #shead { position: absolute; top: 0; left: 0; right: 0; height: 250px; background: #15171c; border-bottom: 1px solid #2a2e37; z-index: 2; }
  #shead .hwrap { max-width: 720px; margin: 0 auto; padding: 14px 18px 0; }
  #sbody { position: absolute; top: 251px; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #sbody .wrap { padding-top: 4px; }
  .pv { display: flex; align-items: center; }
  .miniwrap { position: relative; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .mini { position: relative; width: 250px; height: 164px; border-radius: 12px; overflow: hidden; border: 1px solid #2a2e37; -webkit-flex-shrink: 0; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; }
  .mini .face { width: 96px; height: 96px; }
  .mini .time { font-size: 22px; font-weight: 200; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .mini .label { font-size: 11px; font-weight: 300; }
  .pvside { -webkit-flex: 1; flex: 1; margin-left: 16px; }
  #pvtabs button.b { padding: 8px 12px; margin: 0 4px 6px 0; }
  #pvnote { min-height: 18px; margin: 2px 0 6px; }

  /* day simulation */
  #simbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: none; background: rgba(21,23,28,.92);
    border-top: 1px solid #2a2e37; padding: 8px 14px 10px; color: #e8e8ea; font-size: 15px; }
  #simbar .srow { display: flex; align-items: center; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  #simbar .srow > * { margin: 2px 8px 2px 0; }
  #simbar button.b { margin: 2px 8px 2px 0; padding: 8px 12px; min-width: 44px; }
  #simbar input[type=range] { width: 140px; }
  #simNow { min-width: 170px; font-variant-numeric: tabular-nums; }
  #simbar .grow { -webkit-flex: 1; flex: 1; }
  #simline { position: relative; height: 26px; margin-top: 6px; border-radius: 6px; overflow: hidden; background: #2a2e37; cursor: pointer; }
  #simline .seg { position: absolute; top: 0; bottom: 0; }
  #simhead { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: #fff; box-shadow: 0 0 4px #000; }
  #simbar .slabels { display: flex; justify-content: space-between; font-size: 12px; color: #8a8f9c; margin-top: 3px; }
  body.sim .clk { bottom: 120px; }
  body.sim .clk .face { width: 52vmin; height: 52vmin; }
  /* "See all" carousel for night scenes / animals: one big card at a time, neighbours peek in */
  #gallery { background: #0b0c0f; z-index: 25; overflow: hidden; }
  #gallery .gtop { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0; }
  #gallery .gtop h2 { margin: 0; font-size: 20px; font-weight: 600; }
  #gchips { padding: 10px 14px 0; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #gchips button { font-size: 14px; background: #2a2e37; color: #e8e8ea; border: 0; border-radius: 999px; padding: 6px 12px; margin: 0 6px 0 0; font-family: inherit; }
  #gchips button.on { background: #2f6fed; }
  #gtrack { display: flex; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    padding: 12px 0; margin-top: 4px; }
  #gtrack .gpad { -webkit-flex-shrink: 0; flex-shrink: 0; width: 13.5vw; } /* pad + card margin = 15vw, so a 70vw card sits centred */
  #gtrack .gcard { -webkit-flex-shrink: 0; flex-shrink: 0; width: 70vw; margin: 0 1.5vw; scroll-snap-align: center; text-align: center; }
  #gtrack .gstage { position: relative; width: 100%; height: 58vh; border-radius: 18px; overflow: hidden; background: #000;
    border: 2px solid #2a2e37; display: flex; align-items: center; justify-content: center; }
  #gtrack .gcard.on .gstage { border-color: #fff; }
  #gtrack .gstage > svg { width: 62%; height: auto; display: block; }
  #gtrack .glayer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
  #gtrack .glayer svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #gtrack .gname { margin-top: 10px; font-size: 18px; color: #e8e8ea; }
  #gallery .gnav { display: flex; align-items: center; justify-content: center; }
  #gallery .gnav button.b { min-width: 64px; }
  #gcount { color: #8a8f9c; min-width: 70px; text-align: center; margin: 0 10px; }
  /* "View SVG": still source of one drawing, to copy into a drawing tool */
  #svgview { background: rgba(11,12,15,.97); z-index: 27; }
  #svgview .wrap { max-width: 900px; }
  #svgpreview { width: 240px; height: 240px; margin: 8px auto 12px; background: #000; border-radius: 12px; border: 1px solid #2a2e37; }
  #svgpreview svg { width: 100%; height: 100%; display: block; }
  #svgsrc { height: 38vh; font-size: 11px; }
  button.gl { background: none; border: 0; color: #5b9dff; font-size: 15px; padding: 4px 0 4px 10px; font-family: inherit; }
  #toast { position: fixed; left: 50%; top: 20px; z-index: 40; -webkit-transform: translateX(-50%); transform: translateX(-50%);
    background: #2f6fed; color: #fff; padding: 10px 18px; border-radius: 10px; display: none; font-size: 15px; }
</style>
</head>

<div id="simbar">

</div>
<div id="toast"></div>

<div id="pinpad" class="overlay">

    <div id="pindots"></div>
    <div id="pinmsg"></div>
    <div class="keys" id="pinkeys"></div>
  </div>
</div>

<div id="gallery" class="overlay">

</div>

<div id="svgview" class="overlay">

    <div class="topbar"><h1 id="svgtitle"></h1><button class="b g" id="svgclose">Close</button></div>

    <div style="margin-top:8px"><button class="b" id="svgcopy">Select all &amp; copy</button></div>
    <p class="hint">A still copy of this drawing in the current night colour. Edit it in any drawing tool and paste it back in the Claude chat to use it in the clock.</p>
  </div>
</div>

<div id="settings" class="overlay">
  <div id="shead"><div class="hwrap">
    <div class="topbar"><h1>Sleep Clock</h1><button class="b ok" id="done">Done</button></div>
    <div class="pv">
      <div class="miniwrap"><div id="mini" class="mini"><div id="miniFace" class="face"></div><div id="miniBelow" class="below"></div><div id="miniTime" class="time"></div><div id="miniLabel" class="label"></div><div id="miniLayer" class="layer"></div></div></div>
      <div class="pvside">

        <div class="hint" id="pvnote"></div>

  <div id="sbody"><div class="wrap" id="swrap"></div></div>
</div>

<script>
(function () {
  'use strict';
  /* Written for Safari 12: no optional chaining, no ??, no class fields, no replaceAll. */

  var VERSION = '1.4';
  var KEY = 'toddler-sleep-train-clock.settings.v1';
  var FIRED_KEY = 'toddler-sleep-train-clock.fired';
  var CODE_PREFIX = 'toddler-sleep-train-clock.v1:';
  var OLD_CODE_PREFIX = 'OKC1:'; // export codes made before the rename
  // one-time move of data saved under the old "okclock" keys
  try {
    [['okclock.settings.v1', KEY], ['okclock.fired', FIRED_KEY]].forEach(function (p) {
      var old = window.localStorage.getItem(p[0]);
      if (old !== null && window.localStorage.getItem(p[1]) === null) window.localStorage.setItem(p[1], old);
      if (old !== null) window.localStorage.removeItem(p[0]);
    });
  } catch (e) {}
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var ORDER = [1, 2, 3, 4, 5, 6, 0]; // show Monday first
  var FADE_OPTS = [0, 1, 3, 5, 10];
  var TONES = { chime: 'Chime', musicbox: 'Music box', birds: 'Birds', dingdong: 'Ding-dong' };
  var NIGHT_COLORS = { red: '#ff3b1f', orange: '#ff7a1a', amber: '#ffb000', pink: '#ff5c8a', purple: '#a66bff', blue: '#5b8cff' };
  // day: face colour + a very dark tint of it for the background
  var DAY_COLORS = {
    blue: { face: '#7aa7ff', bg: '#0b1220' }, green: { face: '#5ad17a', bg: '#0a1a0f' },
    yellow: { face: '#ffd84d', bg: '#1a1606' }, pink: { face: '#ff8fb8', bg: '#1c0b12' },
    purple: { face: '#b48cff', bg: '#130d1f' }, teal: { face: '#4fd1c5', bg: '#071a18' },
    white: { face: '#f2f2f2', bg: '#141414' }
  };

  // ---------- sleeping animals: drawings are plain SVG in the ANIMAL DRAWINGS <template> section of the page ----------
  var ANIMALS = {}, ANIMAL_LIST = [];
  (function () {
    var ts = document.querySelectorAll('template[id^="animal-"]');
    for (var i = 0; i < ts.length; i++) {
      var id = ts[i].id.slice(7);
      ANIMALS[id] = { name: ts[i].getAttribute('data-name'), cat: ts[i].getAttribute('data-cat'), tpl: ts[i] };
      ANIMAL_LIST.push([id, ANIMALS[id].name, ANIMALS[id].cat]); // 3rd item = <optgroup> in the settings list
    }
  })();

  // ---------- night animations: registry ----------
  // A scene replaces the night face (choose one); extras draw on top (any number).
  // opt: { key, label, type: 'choice' | 'toggle', values: [[value, label], ...] (choice only), def }
  // Scene ids, extra ids and option keys must not contain '-': onNightControl splits control ids on '-'
  // (na-<scene>-<key>, nx-<extra>-<key>), so a hyphen in any of those names would break that split.
  var SCENES = {
    off: { name: 'Off', face: sceneOff, opts: [] },
    classic: { name: 'Z’s & stars', face: sceneClassic, opts: [
      { key: 'stars', label: 'Stars', type: 'choice', values: [[3, '3'], [6, '6'], [10, '10']], def: 3 },
      { key: 'zz', label: 'Floating z’s', type: 'toggle', def: true },
      { key: 'speed', label: 'Speed', type: 'choice', values: [['slow', 'Slow'], ['normal', 'Normal']], def: 'normal' }
    ] },
    breathing: { name: 'Breathing', face: sceneBreathing, opts: [
      { key: 'pace', label: 'Pace', type: 'choice', values: [[4, '4 breaths a minute'], [6, '6 breaths a minute'], [8, '8 breaths a minute']], def: 6 },
      { key: 'depth', label: 'Depth', type: 'choice', values: [['subtle', 'Subtle'], ['medium', 'Medium'], ['deep', 'Deep']], def: 'medium' },
      { key: 'glow', label: 'Glow on in-breath', type: 'toggle', def: true }
    ] },
    moon: { name: 'Moon & sky', face: sceneMoon, layer: skyLayer, opts: [
      { key: 'sky', label: 'Sky stars', type: 'choice', values: [[10, '10'], [25, '25'], [50, '50']], def: 25 },
      { key: 'twinkle', label: 'Twinkle', type: 'choice', values: [['off', 'Off'], ['slow', 'Slow'], ['normal', 'Normal']], def: 'slow' },
      { key: 'face', label: 'Sleepy face on the moon', type: 'toggle', def: true }
    ] },
    animal: { name: 'Night picture', face: sceneAnimal, opts: [
      { key: 'animal', label: 'Picture', type: 'choice', values: ANIMAL_LIST, def: 'bunny' },
      { key: 'breath', label: 'Breathing / gentle movement', type: 'toggle', def: true },
      { key: 'moves', label: 'Little movements', type: 'choice', values: [['off', 'Off'], ['rare', 'Rare'], ['normal', 'Normal']], def: 'rare' }
    ] }
  };
  var EXTRAS = {
    countdown: { name: 'Star countdown', place: 'below', draw: drawCountdown, key: function (o, c) { var g = countdownGoing(o.count, c); return g.lit + (g.going ? 'g' : ''); }, opts: [
      { key: 'count', label: 'Number of stars', type: 'choice', values: [[5, '5'], [8, '8'], [10, '10'], [12, '12']], def: 8 },
      { key: 'layout', label: 'Layout', type: 'choice', values: [['arc', 'Arc'], ['row', 'Row']], def: 'arc' },
      { key: 'out', label: 'How a star goes out', type: 'choice', values: [['fade', 'Fade'], ['pop', 'Pop']], def: 'fade' }
    ] },
    fireflies: { name: 'Fireflies', place: 'layer', draw: drawFireflies, opts: [
      { key: 'count', label: 'How many', type: 'choice', values: [[3, '3'], [5, '5'], [8, '8']], def: 5 },
      { key: 'speed', label: 'Speed', type: 'choice', values: [['vslow', 'Very slow'], ['slow', 'Slow']], def: 'vslow' },
      { key: 'color', label: 'Colour', type: 'choice', values: [['night', 'Match night colour'], ['warm', 'Warm yellow']], def: 'night' }
    ] },
    shooting: { name: 'Shooting star', place: 'layer', draw: drawShooting, key: function (o, c) {
      if (c.preview) return 'preview';
      return o.firstHour && c.now >= c.since + 3600000 ? 'done' : Math.floor((c.now - c.since) / 3600000);
    }, opts: [
      { key: 'every', label: 'How often', type: 'choice', values: [[2, 'Every 2 minutes'], [5, 'Every 5 minutes'], [10, 'Every 10 minutes']], def: 5 },
      { key: 'firstHour', label: 'Only in the first hour after bedtime', type: 'toggle', def: true }
    ] }
  };

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function optDefaults(opts) { var o = {}; for (var i = 0; i < opts.length; i++) o[opts[i].key] = opts[i].def; return o; }
  function optValid(opt, v) {
    if (opt.type === 'toggle') return typeof v === 'boolean';
    for (var i = 0; i < opt.values.length; i++) if (opt.values[i][0] === v) return true;
    return false;
  }
  function mergeOpts(target, opts, src) {
    if (!src || typeof src !== 'object') return;
    for (var i = 0; i < opts.length; i++) if (has(src, opts[i].key) && optValid(opts[i], src[opts[i].key])) target[opts[i].key] = src[opts[i].key];
  }
  function nightDefaults() {
    var n = { scene: 'classic', scenes: {}, extras: {} }, k;
    for (k in SCENES) n.scenes[k] = optDefaults(SCENES[k].opts);
    for (k in EXTRAS) { n.extras[k] = optDefaults(EXTRAS[k].opts); n.extras[k].on = false; }
    return n;
  }
  // Checks saved night settings against the registry: unknown names and keys are dropped, invalid values keep the default.
  function mergeNight(n, o) {
    if (!o || typeof o !== 'object') return;
    if (typeof o.scene === 'string' && has(SCENES, o.scene)) n.scene = o.scene;
    var k, src;
    for (k in SCENES) mergeOpts(n.scenes[k], SCENES[k].opts, o.scenes && typeof o.scenes === 'object' && has(o.scenes, k) ? o.scenes[k] : null);
    for (k in EXTRAS) {
      src = o.extras && typeof o.extras === 'object' && has(o.extras, k) ? o.extras[k] : null;
      mergeOpts(n.extras[k], EXTRAS[k].opts, src);
      if (src && typeof src === 'object' && typeof src.on === 'boolean') n.extras[k].on = src.on;
    }
  }

  function defaults() {
    var days = [];
    for (var i = 0; i < 7; i++) {
      var weekend = (i === 0 || i === 6);
      days.push({ bed: '19:00', wake: weekend ? '07:30' : '07:00', tone: 'off' });
    }
    return {
      days: days,
      greenMin: 60,        // how long the green "OK to wake" face stays
      soonMin: 0,          // amber "almost time" before wake (0 = off)
      nightColor: 'red',
      nightDim: 35,        // % brightness of face at night
      dayMode: 'face',     // face | clock | dark
      dayColor: 'blue',
      dayDim: 100,         // % brightness of face/time in the day
      fadeSec: 3,          // crossfade length at each phase change (0 = hard change)
      night: nightDefaults(), // night scene + extras, see SCENES / EXTRAS
      showTime: true,
      showTimeNight: false,
      h24: true,
      showLabel: false,
      volume: 60,
      alarmLen: 60,        // seconds the wake sound plays (0 = until tapped, max 5 min)
      fadeIn: true,
      noise: false,
      noiseVol: 25,
      napSound: 'chime',
      pin: '',
      nap: null            // {start, end} ms timestamps
    };
  }

  // ---------- storage ----------
  function load() {
    var s = defaults();
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) merge(s, JSON.parse(raw));
    } catch (e) {}

  function optRow(id, opt, val) {
    if (opt.type === 'toggle') return '<div class="row sub"><label class="l">' + opt.label + '</label>' + sw(id, val) + '</div>';
    var h = '<div class="row sub"><label class="l">' + opt.label + '</label><select id="' + id + '">';
    for (var i = 0, grp = null; i < opt.values.length; i++) {
      var g = opt.values[i][2]; // optional group (Night picture categories)
      if (g && g !== grp) { h += (grp ? '</optgroup>' : '') + '<optgroup label="' + g + '">'; grp = g; }
      h += '<option value="' + i + '"' + (opt.values[i][0] === val ? ' selected' : '') + '>' + opt.values[i][1] + '</option>';
    }
    return h + (grp ? '</optgroup>' : '') + '</select></div>';
  }
  function nightSettingsHTML() {
    var n = S.night, so = SCENES[n.scene].opts, k, i;
    var h = '<h3>Animation</h3><div class="row"><label class="l">Scene<button class="gl" data-gallery="scene">See all ▸</button></label><select id="na-scene">';
    for (k in SCENES) h += '<option value="' + k + '"' + (k === n.scene ? ' selected' : '') + '>' + SCENES[k].name + '</option>';
    h += '</select></div>';
    for (i = 0; i < so.length; i++) h += optRow('na-' + n.scene + '-' + so[i].key, so[i], n.scenes[n.scene][so[i].key]);
    if (Object.keys(EXTRAS).length) h += '<h3>Extras</h3>';
    for (k in EXTRAS) {
      var x = n.extras[k], xo = EXTRAS[k].opts;
      h += '<div class="row"><label class="l">' + EXTRAS[k].name + '</label>' + sw('nx-' + k + '-on', x.on) + '</div>';
      if (x.on) for (i = 0; i < xo.length; i++) h += optRow('nx-' + k + '-' + xo[i].key, xo[i], x[xo[i].key]);
    }
    return h;
  }
  function optByKey(opts, key) { for (var i = 0; i < opts.length; i++) if (opts[i].key === key) return opts[i]; return null; }
  function rerenderSettings() { var y = $('sbody').scrollTop; renderSettings(); $('sbody').scrollTop = y; }
  function onNightControl(e) {
    var el = e.target, p = el.id.split('-');
    if (el.id === 'na-scene') { S.night.scene = el.value; save(); rerenderSettings(); return; }
    var isScene = p[0] === 'na', reg = isScene ? SCENES[p[1]] : EXTRAS[p[1]], store = isScene ? S.night.scenes[p[1]] : S.night.extras[p[1]];
    if (p[2] === 'on') { store.on = el.checked; save(); rerenderSettings(); return; }
    var opt = optByKey(reg.opts, p[2]);
    store[p[2]] = opt.type === 'toggle' ? el.checked : opt.values[+el.value][0];
    save();
  }

  // ---------- "See all" carousel: every scene and Night picture as a big animated card ----------
  // Card ids: a scene id, or 'animal:<id>' for a Night picture. With 100+ cards only the few around the middle are drawn
  // (the rest are empty frames with their name), so the old iPad isn't animating everything at once. Chips jump to a category.
  var gal = null; // { ids: [...], cats: [...] }
  function galleryIsCurrent(id) {
    var n = S.night;
    return id.indexOf('animal:') === 0 ? n.scene === 'animal' && n.scenes.animal.animal === id.slice(7) : n.scene === id;
  }
  function galleryCat(id) { return id.indexOf('animal:') === 0 ? ANIMALS[id.slice(7)].cat : 'Scenes'; }
  function galleryName(id) { return id.indexOf('animal:') === 0 ? ANIMALS[id.slice(7)].name : SCENES[id].name; }
  function galleryCard(id) {
    return '<div class="gcard' + (galleryIsCurrent(id) ? ' on' : '') + '" data-id="' + id + '"><div class="gstage" style="opacity:' + Math.max(S.nightDim / 100, 0.6) + '"></div>' +
      '<div class="gname"><span class="gn">' + galleryName(id) + '</span><button class="gl" data-svg="' + id + '">View SVG</button></div></div>';
  }
  function galleryDraw(id, i) {
    var n = S.night, c = { color: NIGHT_COLORS[S.nightColor], gid: 'shGal' + i, frac: 0.5, now: Date.now(), since: 0, until: 0, scale: 1, w: 600, h: 400 };
    var animal = id.indexOf('animal:') === 0 ? id.slice(7) : null, sc = animal ? SCENES.animal : SCENES[id], o = n.scenes[animal ? 'animal' : id], k;
    if (animal) { var ao = {}; for (k in o) ao[k] = o[k]; ao.animal = animal; o = ao; }
    return sc.face(o, c) + (sc.layer ? '<div class="glayer">' + sc.layer(o, c) + '</div>' : '');
  }
  function galleryFill() { // draw the cards next to the middle one, empty the far ones
    if (!gal) return;
    var mid = galleryIndex(), cards = $('gtrack').querySelectorAll('.gcard'), i, st;
    for (i = 0; i < cards.length; i++) {
      st = cards[i].firstChild;
      if (Math.abs(i - mid) <= 2) { if (!st.firstChild) st.innerHTML = galleryDraw(gal.ids[i], i); }
      else if (st.firstChild) st.innerHTML = '';
    }
  }
  function openGallery() { // every scene, then every Night picture; opens on the current one
    var ids = [], h = '<div class="gpad"></div>', i, k, start = 0, cats = [], chips = '';
    for (k in SCENES) { if (k !== 'animal') ids.push(k); }
    for (k in ANIMALS) ids.push('animal:' + k);
    for (i = 0; i < ids.length; i++) {
      h += galleryCard(ids[i]);
      if (galleryIsCurrent(ids[i])) start = i;
      if (cats.indexOf(galleryCat(ids[i])) < 0) { cats.push(galleryCat(ids[i])); chips += '<button data-cat="' + galleryCat(ids[i]) + '">' + galleryCat(ids[i]) + '</button>'; }
    }
    gal = { ids: ids };
    $('gtitle').textContent = 'Night scenes & pictures';
    $('gchips').innerHTML = chips;
    $('gtrack').innerHTML = h + '<div class="gpad"></div>';
    $('gallery').className = 'overlay show';
    galleryGo(start);
  }
  function galleryStep() { var c = $('gtrack').querySelectorAll('.gcard'); return c.length > 1 ? c[1].offsetLeft - c[0].offsetLeft : 1; }
  function galleryIndex() { return Math.max(0, Math.min(gal.ids.length - 1, Math.round($('gtrack').scrollLeft / galleryStep()))); }
  function galleryGo(i) {
    i = Math.max(0, Math.min(gal.ids.length - 1, i));
    $('gtrack').scrollLeft = i * galleryStep();
    galleryCount();
  }
  function galleryCount() {
    if (!gal) return;
    var i = galleryIndex(), cat = galleryCat(gal.ids[i]), chips = $('gchips').querySelectorAll('button'), k;
    $('gcount').textContent = (i + 1) + ' / ' + gal.ids.length;
    for (k = 0; k < chips.length; k++) chips[k].className = chips[k].getAttribute('data-cat') === cat ? 'on' : '';
    galleryFill();
  }
  function closeGallery() { gal = null; $('gallery').className = 'overlay'; $('gtrack').innerHTML = ''; $('gchips').innerHTML = ''; } // empty: no animations left running
  $('gchips').addEventListener('click', function (e) {
    var cat = e.target.getAttribute && e.target.getAttribute('data-cat'), i;
    if (!cat || !gal) return;
    for (i = 0; i < gal.ids.length; i++) if (galleryCat(gal.ids[i]) === cat) { galleryGo(i); return; }
  });
  function galleryPick(id) {
    if (id.indexOf('animal:') === 0) { S.night.scene = 'animal'; S.night.scenes.animal.animal = id.slice(7); }
    else S.night.scene = id;
    save(); closeGallery(); pvMode = 'sleep'; rerenderSettings();
  }
  $('gclose').addEventListener('click', closeGallery);
  $('gprev').addEventListener('click', function () { galleryGo(galleryIndex() - 1); });
  $('gnext').addEventListener('click', function () { galleryGo(galleryIndex() + 1); });
  $('gpick').addEventListener('click', function () { galleryPick(gal.ids[galleryIndex()]); });
  $('gtrack').addEventListener('scroll', galleryCount);
  $('gtrack').addEventListener('click', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-svg')) { showSvg(e.target.getAttribute('data-svg')); return; }
    for (var n = e.target; n && n !== this; n = n.parentNode) if (n.getAttribute && n.getAttribute('data-id')) { galleryPick(n.getAttribute('data-id')); return; }
  });
  // Still, standalone SVG of one card (scene face or animal): animations removed, fixed size, current night colour.
  function stillSvg(id) {
    var n = S.night, animal = id.indexOf('animal:') === 0 ? id.slice(7) : null, sc = animal ? SCENES.animal : SCENES[id], o = {}, k;
    var src = n.scenes[animal ? 'animal' : id];
    for (k in src) o[k] = src[k];
    if (animal) { o.animal = animal; o.breath = false; o.moves = 'off'; }
    var d = document.createElement('div');
    d.innerHTML = sc.face(o, { color: NIGHT_COLORS[S.nightColor], gid: 'svgExport', frac: 0.5, now: Date.now(), since: 0, until: 0, scale: 1, w: 600, h: 400 });
    var svg = d.firstChild, anims = svg.querySelectorAll('animate, animateTransform, animateMotion, set'), i;
    for (i = 0; i < anims.length; i++) anims[i].parentNode.removeChild(anims[i]);
    svg.setAttribute('width', '560'); svg.setAttribute('height', '560');
    svg.removeAttribute('style'); // animals paint with currentColor; spell the colour out for drawing tools
    return new XMLSerializer().serializeToString(svg).replace(/currentColor/g, NIGHT_COLORS[S.nightColor]);
  }
  function showSvg(id) {
    var src = stillSvg(id), animal = id.indexOf('animal:') === 0 ? id.slice(7) : null;
    $('svgtitle').textContent = (animal ? ANIMALS[animal].name : SCENES[id].name) + ' · SVG';

  }
  $('svgclose').addEventListener('click', function () { $('svgview').className = 'overlay'; $('svgpreview').innerHTML = ''; });
  $('svgcopy').addEventListener('click', function () {
    var t = $('svgsrc'), ok = false;
    t.focus(); t.setSelectionRange(0, t.value.length); // iOS 12 needs an editable field for this

    var standalone = !!window.navigator.standalone;
    var h = '';
    if (!standalone) h += '<div class="status bad">Opened in a normal Safari tab. Use Share → <b>Add to Home Screen</b> and run it from that icon. Settings saved here are separate from the home-screen version.</div>';

      '<div id="audioStatus"></div>' +

      '<div class="row"><label class="l">24-hour clock</label>' + sw('h24', S.h24) + '</div>' +

        '<td><input type="time" data-day="' + d + '" data-f="wake" value="' + c.wake + '"></td>' +
        '<td><input type="time" data-day="' + d + '" data-f="bed" value="' + c.bed + '"></td>' +

    h += '</table><div style="margin-top:8px"><button class="b g" id="copyWk">Copy Monday → Tue–Fri</button><button class="b g" id="copyWe">Copy Saturday → Sunday</button></div>' +
      '<p class="hint">Wake = the morning of that day. Bedtime = the evening of that day. Red runs from bedtime until the next morning’s wake time.</p></div>';

    // one section per phase; data-pv makes the mini preview follow whatever is touched inside it
    h += '<div class="sec" data-pv="sleep"><h2><span class="dot" id="dotNight"></span>Night <small>bedtime → wake</small></h2>' +
      '<div class="row"><label class="l">Colour</label>' + swatches('nightColor', NIGHT_COLORS, S.nightColor) + '</div>' +
      '<div class="row"><label class="l">Brightness</label><input type="range" min="5" max="100" step="5" id="nightDim" value="' + S.nightDim + '"><span class="val" id="nightDimV">' + S.nightDim + '%</span></div>' +
      '<p class="hint">Red, orange and amber are the most sleep-friendly. Blue and purple light is more stimulating at night.</p>' +
      '<div class="row"><label class="l">Show the time at night</label>' + sw('showTimeNight', S.showTimeNight) + '</div>' +
      '<div class="row"><label class="l">Soft noise</label>' + sw('noise', S.noise) + '</div>' +
      '<div class="row"><label class="l">Noise volume</label><input type="range" min="5" max="100" step="5" id="noiseVol" value="' + S.noiseVol + '"><span class="val" id="noiseVolV">' + S.noiseVol + '%</span></div>' +
      nightSettingsHTML() + '</div>';

    h += '<div class="sec" data-pv="soon"><h2><span class="dot" style="background:#ffb300"></span>Almost time <small>amber, before wake</small></h2>' +

        numOpts([[0, 'Off'], [10, '10 min'], [15, '15 min'], [20, '20 min'], [30, '30 min']], S.soonMin) + '</select></div></div>';

    h += '<div class="sec" data-pv="wake"><h2><span class="dot" style="background:#34c759"></span>Wake <small>green, OK to get up</small></h2>' +

      '<div class="row"><label class="l">Wake sound plays for</label><select id="alarmLen">' +
        numOpts([[20, '20 seconds'], [60, '1 minute'], [120, '2 minutes'], [300, '5 minutes'], [0, 'Until tapped (max 5 min)']], S.alarmLen) + '</select></div>' +

      '<button class="b" data-nap="30">30 min</button><button class="b" data-nap="45">45 min</button><button class="b" data-nap="60">1 h</button>' +

      '<textarea id="codeBox" placeholder="Export puts a code here to copy somewhere safe. To restore, paste a code and tap Import."></textarea></div>';

    // setup help
    h += '<div class="sec"><h2>iPad setup checklist</h2><ol class="setup">' +
      '<li>Settings → Display &amp; Brightness → <b>Auto-Lock: Never</b>; turn Auto-Brightness off (Accessibility → Display Accommodations).</li>' +

    $('swrap').innerHTML = h;

    wireSettings();

  }

  function renderAudioStatus() {
    var el = $('audioStatus'); if (!el) return;
    if (!AC) { el.innerHTML = '<div class="status bad">This browser has no Web Audio, so sound won’t work.</div>'; return; }
    el.innerHTML = audioReady() ? '<div class="status good">🔊 Sound is enabled</div>'
      : '<div class="status bad">🔇 Sound is locked. Tap anywhere to enable it.</div>';
  }

  function wireSettings() {
    var w = $('swrap');
    function on(id, ev, fn) { var e = $(id); if (e) e.addEventListener(ev, fn); }

    var inputs = w.querySelectorAll('[data-day]');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener('change', function (e) {
        var t = e.target, d = +t.getAttribute('data-day'), f = t.getAttribute('data-f');
        if (f === 'tone') S.days[d].tone = t.value;
        else if (/^\d\d:\d\d$/.test(t.value)) S.days[d][f] = t.value;
        else { t.value = S.days[d][f]; return; }
        if (hm(S.days[d].bed) <= hm(S.days[d].wake)) toast('Bedtime should be later than wake time');
        save();
      });
    }
    on('copyWk', 'click', function () { for (var d = 2; d <= 5; d++) { S.days[d].wake = S.days[1].wake; S.days[d].bed = S.days[1].bed; S.days[d].tone = S.days[1].tone; } save(); renderSettings(); toast('Copied to Tue–Fri'); });
    on('copyWe', 'click', function () { S.days[0].wake = S.days[6].wake; S.days[0].bed = S.days[6].bed; S.days[0].tone = S.days[6].tone; save(); renderSettings(); toast('Copied to Sunday'); });

    ['greenMin', 'soonMin', 'alarmLen', 'fadeSec'].forEach(function (id) { on(id, 'change', function (e) { S[id] = +e.target.value; save(); }); });
    var sws = w.querySelectorAll('[data-sw]');
    for (i = 0; i < sws.length; i++) sws[i].addEventListener('click', function (e) {
      var b = e.target, key = b.getAttribute('data-sw');
      S[key] = b.getAttribute('data-c'); save(); MAIN.keys = {};
      var sib = w.querySelectorAll('[data-sw="' + key + '"]');
      for (var j = 0; j < sib.length; j++) sib[j].className = 'swc' + (sib[j] === b ? ' on' : '');
    });
    var gl = w.querySelectorAll('[data-gallery]');
    for (i = 0; i < gl.length; i++) gl[i].addEventListener('click', function () { openGallery(); });
    var nc = w.querySelectorAll('[id^="na-"], [id^="nx-"]');
    for (i = 0; i < nc.length; i++) nc[i].addEventListener('change', onNightControl);
    ['napSound', 'dayMode'].forEach(function (id) { on(id, 'change', function (e) { S[id] = e.target.value; save(); MAIN.keys = {}; }); });
    ['fadeIn', 'noise', 'showTime', 'showTimeNight', 'h24', 'showLabel'].forEach(function (id) { on(id, 'change', function (e) { S[id] = e.target.checked; save(); }); });
    ['volume', 'noiseVol', 'nightDim', 'dayDim'].forEach(function (id) {
      on(id, 'input', function (e) { S[id] = +e.target.value; $(id + 'V').textContent = S[id] + '%'; if (id === 'noiseVol' && noiseGain) setNoise(true); });
      on(id, 'change', function () { save(); });
    });
    on('testBtn', 'click', function () {
      unlockAudio();
      setTimeout(function () { if (!playAlarm($('testTone').value, 8)) toast('Sound is locked. Tap again.'); renderAudioStatus(); }, 150);
    });
    on('stopBtn', 'click', stopAlarm);

    var naps = w.querySelectorAll('[data-nap]');
    for (i = 0; i < naps.length; i++) naps[i].addEventListener('click', function (e) {
      var m = +e.target.getAttribute('data-nap'), t = Date.now();
      S.nap = { start: t, end: t + m * 60000 }; save(); toast('Nap started, ' + m + ' min'); closeSettings();
    });
    on('napCancel', 'click', function () { S.nap = null; save(); renderSettings(); });


    on('pinSet', 'click', function () { showPin('set'); });
    on('pinDel', 'click', function () { S.pin = ''; save(); renderSettings(); toast('PIN removed'); });

    on('expBtn', 'click', function () {
      var o = JSON.parse(JSON.stringify(S)); o.nap = null;
      var code = CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
      var box = $('codeBox'); box.value = code; box.focus(); box.setSelectionRange(0, code.length);
      toast('Code ready. Copy it somewhere safe.');
    });
    on('impBtn', 'click', function () {
      var v = $('codeBox').value.replace(/\s+/g, '');
      var plen = v.indexOf(CODE_PREFIX) === 0 ? CODE_PREFIX.length : v.indexOf(OLD_CODE_PREFIX) === 0 ? OLD_CODE_PREFIX.length : 0;
      if (!plen) { toast('That isn’t a Sleep Clock code'); return; }
      try {
        var o = JSON.parse(decodeURIComponent(escape(atob(v.slice(plen)))));
        var fresh = defaults(); merge(fresh, o); fresh.nap = null; S = fresh; save(); renderSettings(); toast('Settings imported');
      } catch (e) { toast('Code is damaged'); }
    });
    on('resetBtn', 'click', function () {
      var b = $('resetBtn');
      if (b.getAttribute('data-sure')) { S = defaults(); save(); renderSettings(); toast('Reset to defaults'); }
      else { b.setAttribute('data-sure', '1'); b.textContent = 'Tap again to reset'; }
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2200);
  }

  // ---------- start ----------
  // ---------- live preview in settings ----------
  var pvMode = 'day';
  var PHASE_NAMES = { sleep: 'Night', soon: 'Almost time', wake: 'Green', day: 'Day' };
  // Which preview tab a settings control belongs to.
  var PV_FOR = { nightColor: 'sleep', nightDim: 'sleep', showTimeNight: 'sleep', noise: 'sleep', dayColor: 'day', dayDim: 'day', dayMode: 'day',
    greenMin: 'wake', soonMin: 'soon', bed: 'sleep', wake: 'wake' };
  // The preview's night is tonight (today's bedtime to tomorrow's wake), so the countdown shows half its stars.
  function pvState(mode) {
    if (mode !== 'sleep') return { mode: mode };
    var now = new Date(), tmr = new Date(now.getTime()); tmr.setDate(tmr.getDate() + 1);
    return { mode: 'sleep', since: at(now, S.days[now.getDay()].bed).getTime(), until: at(tmr, S.days[tmr.getDay()].wake).getTime(), preview: true };
  }
  function pvTime(mode) {
    var now = new Date(), c = S.days[now.getDay()], W = at(now, c.wake).getTime();
    if (mode === 'sleep') { var ns = pvState('sleep'); return new Date((ns.since + ns.until) / 2); } // middle of tonight
    if (mode === 'soon') return new Date(W - (S.soonMin || 10) * 60000);
    if (mode === 'wake') return new Date(W);
    return new Date(W + S.greenMin * 60000);
  }
  function updatePreview() {
    var c = S.days[new Date().getDay()], note;
    paint(MINI, pvTime(pvMode), pvState(pvMode), S.fadeSec * 1000);
    var tabs = $('pvtabs').querySelectorAll('[data-pv]');
    for (var i = 0; i < tabs.length; i++) tabs[i].className = 'b' + (tabs[i].getAttribute('data-pv') === pvMode ? '' : ' g');
    if (pvMode === 'sleep') note = 'Night, today from ' + fmtStr(c.bed);
    else if (pvMode === 'soon') note = S.soonMin ? 'Almost time, ' + S.soonMin + ' min before wake' : 'Almost time is off (turn it on under Almost time)';
    else if (pvMode === 'wake') note = 'Green, today at ' + fmtStr(c.wake) + ' for ' + S.greenMin + ' min';
    else note = 'Day, today until ' + fmtStr(c.bed);
    $('pvnote').textContent = note;
    var dn = $('dotNight'), dd = $('dotDay');
    if (dn) dn.style.background = NIGHT_COLORS[S.nightColor];
    if (dd) dd.style.background = (DAY_COLORS[S.dayColor] || DAY_COLORS.blue).face;
  }
  $('pvtabs').addEventListener('click', function (e) {
    var m = e.target.getAttribute && e.target.getAttribute('data-pv'); if (!m) return;
    pvMode = m; updatePreview();
  });
  // Element handlers update S first; these bubble up afterwards and refresh the preview.
  function pvFollow(e) {
    var t = e.target; if (!t || !t.getAttribute) return;
    var k = t.getAttribute('data-sw') || t.getAttribute('data-f') || t.id;
    if (PV_FOR[k]) pvMode = PV_FOR[k];
    else for (var n = t; n && n.getAttribute; n = n.parentNode) { var pv = n.getAttribute('data-pv'); if (pv) { pvMode = pv; break; } }
    updatePreview();
  }
  $('sbody').addEventListener('input', pvFollow);
  $('sbody').addEventListener('change', pvFollow);
  $('sbody').addEventListener('click', function (e) {
    for (var n = e.target; n && n.getAttribute; n = n.parentNode) if (n.getAttribute('data-pv')) { pvFollow(e); return; }
  });
  $('done').addEventListener('click', closeSettings);

  // ---------- day simulation (pretend clock, nothing saved) ----------
  var DAY_MS = 86400000, SIM_STEP_MS = 100, SIM_MAX_REAL_MS = 10 * 60000;
  var sim = null, simTimer = null, simSpeed = 60;
  function simStartFor(day) {
    var d = new Date(); d.setHours(12, 0, 0, 0);
    while (d.getDay() !== day) d.setDate(d.getDate() + 1);
    return at(d, S.days[day].wake).getTime() - Math.max(30, S.soonMin + 15) * 60000;
  }
  function startSim(day) {
    stopAlarm();
    var t0 = simStartFor(day);
    sim = { day: day, t0: t0, v: t0, real: Date.now(), began: Date.now(), playing: true, muted: sim ? sim.muted : false,
      mode: computeState(new Date(t0), true).mode, done: false };
    document.body.className = 'sim';
    $('badge').style.display = 'none';
    $('simbar').style.display = 'block';
    $('simDay').value = String(day);
    drawSimLine();
    if (!simTimer) simTimer = setInterval(function () { simStep(false); }, SIM_STEP_MS);
    simStep(true);
  }
  // The simulation belongs to settings: every way out returns there (no PIN, it was opened from settings).
  function exitSim(toSettings) {
    if (!sim) return;
    sim = null;
    if (simTimer) { clearInterval(simTimer); simTimer = null; }
    stopAlarm(); setNoise(false);
    document.body.className = '';
    $('simbar').style.display = 'none';
    MAIN.keys = {}; tick();
    if (toSettings !== false) openSettings(true);
  }
  // jump: moved by the user (start or timeline tap). No sound for jumps, only for natural playback.
  function simStep(jump) {
    if (!sim) return;
    var real = Date.now();
    if (real - sim.began > SIM_MAX_REAL_MS) { exitSim(); return; } // never leave the wall clock on pretend time
    if (sim.playing && !jump) sim.v += Math.min(real - sim.real, 250) * DAY_MS / (simSpeed * 1000);
    sim.real = real;
    var end = sim.t0 + DAY_MS;
    if (sim.v >= end) { sim.v = end; if (!sim.done) simFinished(); }
    var now = new Date(sim.v), st = computeState(now, true);
    st.scale = simSpeed * 1000 / DAY_MS; // real ms per pretend ms, for timed night extras
    if (!jump && st.mode === 'wake' && sim.mode !== 'wake' && !sim.muted) playAlarm(st.tone, 3, true);
    sim.mode = st.mode;
    setNoise(S.noise && !sim.muted && st.mode === 'sleep' && !alarmPlaying());
    paint(MAIN, now, st, Math.min(S.fadeSec * 1000, 500)); // sped-up time: keep fades short
    $('simNow').textContent = DAYS[now.getDay()] + ' ' + fmt(now) + ' · ' + PHASE_NAMES[st.mode];
    $('simhead').style.left = ((sim.v - sim.t0) / DAY_MS * 100) + '%';
    $('simPlay').textContent = sim.playing ? '⏸' : (sim.done ? '↺' : '▶︎');
  }
  function simFinished() {
    var s0 = sim;
    sim.playing = false; sim.done = true;
    toast('Simulation finished. Back to settings in a few seconds.');
    setTimeout(function () { if (sim === s0 && sim.done) exitSim(); }, 5000);
  }
  function simColor(mode) {
    if (mode === 'sleep') return NIGHT_COLORS[S.nightColor];
    if (mode === 'soon') return '#ffb300';
    if (mode === 'wake') return '#34c759';
    return (DAY_COLORS[S.dayColor] || DAY_COLORS.blue).face;
  }
  // Coloured phase strip: sample every 5 pretend minutes and merge runs.
  function drawSimLine() {
    var h = '', step = 5 * 60000, runStart = 0, runMode = null;
    for (var t = 0; t <= DAY_MS; t += step) {
      var m = t < DAY_MS ? computeState(new Date(sim.t0 + t), true).mode : null;
      if (m !== runMode) {
        if (runMode) h += '<div class="seg" style="left:' + (runStart / DAY_MS * 100) + '%;width:' + ((t - runStart) / DAY_MS * 100) + '%;background:' + simColor(runMode) + '"></div>';
        runMode = m; runStart = t;
      }
    }
    $('simsegs').innerHTML = h;
    var a = new Date(sim.t0), b = new Date(sim.t0 + DAY_MS);
    $('simFrom').textContent = DAYS[a.getDay()] + ' ' + fmt(a);
    $('simTo').textContent = DAYS[b.getDay()] + ' ' + fmt(b);
  }
  (function buildSimBar() {
    var h = '';
    for (var i = 0; i < 7; i++) h += '<option value="' + ORDER[i] + '">' + DAYS[ORDER[i]] + '</option>';
    $('simDay').innerHTML = h;
  })();
  $('simBtn').addEventListener('click', function () {
    settingsScroll = $('sbody').scrollTop;
    unlockAudio(); closeSettings(); startSim(new Date().getDay());
  });
  $('simDay').addEventListener('change', function (e) { startSim(+e.target.value); });
  $('simPlay').addEventListener('click', function () {
    if (!sim) return;
    if (sim.done) { startSim(sim.day); return; }
    sim.playing = !sim.playing; sim.real = Date.now(); simStep(true);
  });
  $('simMute').addEventListener('click', function () {
    if (!sim) return;
    unlockAudio();
    sim.muted = !sim.muted; $('simMute').textContent = sim.muted ? '🔇' : '🔊';
    if (sim.muted) stopAlarm();
    simStep(true);
  });
  $('simSpeed').addEventListener('input', function (e) { simSpeed = +e.target.value; $('simSpeedV').textContent = simSpeed + ' s'; });
  $('simExit').addEventListener('click', function () { exitSim(); });
  $('simline').addEventListener('click', function (e) {
    if (!sim) return;
    var r = $('simline').getBoundingClientRect();
    var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    sim.v = sim.t0 + f * DAY_MS; sim.playing = false; sim.done = false; stopAlarm();
    simStep(true);
  });

  buildPinKeys();
  tick();
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { MAIN.keys = {}; MAIN.lastMode = null; tick(); } });

  // Offline support (iOS 11.3+). Harmless if unsupported.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) {}
  }

  // test hook (used only by automated tests)
  window.__toddlerSleepTrainClock = { S: function () { return S; }, computeState: computeState, setS: function (o) { S = defaults(); merge(S, o); save(); MAIN.keys = {}; tick(); },
    sim: function () { return sim; }, firedKey: function () { return firedKey; }, alarmPlaying: alarmPlaying,
    night: { SCENES: SCENES, EXTRAS: EXTRAS, defaults: nightDefaults, countdownLit: countdownLit, shootingTimes: shootingTimes, ANIMALS: ANIMALS, sceneAnimal: sceneAnimal },
    nightFrac: nightFrac, repaint: function () { MAIN.keys = {}; MAIN.lastMode = null; tick(); } };
})();
</script>
</body>
</html>
