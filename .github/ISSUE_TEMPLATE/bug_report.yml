name: Report a problem
description: Something doesn't work as expected
title: "[Problem] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you doing, and what went wrong? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: version
    attributes:
      label: Clock version
      description: Filled in automatically when you use the link in the clock's settings.
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: Filled in automatically when you use the link in the clock's settings.
